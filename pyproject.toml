[project]
name = "printlapse"
version = "0.1.0"
description = "Grab frames from an RTSP camera on a timer and build a timelapse video."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
printlapse = "printlapse.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["printlapse*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
printlapse = ["web/index.html", "web/favicon.svg"]
