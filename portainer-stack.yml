# Paste this into Portainer: Stacks -> Add stack -> Web editor.
#
# Build the image on that Docker host first, from this project directory:
#   docker build -t printlapse:latest .
#
# In the stack form, turn off "Pull latest image". Portainer would otherwise
# look for this name on Docker Hub and the deploy would fail.
#
# Open http://<docker-host>:8765/ . There is no password.

services:
  printlapse:
    image: printlapse:latest
    container_name: printlapse
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      PRINTLAPSE_DATA: /data
      # TZ: America/Los_Angeles
    volumes:
      - printlapse:/data

volumes:
  printlapse:
    name: printlapse
